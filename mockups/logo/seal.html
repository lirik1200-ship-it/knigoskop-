<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>seal</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent}body{display:flex;gap:40px;padding:0}#box{width:512px;height:512px}</style>
</head><body><div id="box"></div>
<script>
const R=n=>Math.round(n*100)/100;
function leaf(x,y,ang,len,w){return `<path transform="translate(${R(x)} ${R(y)}) rotate(${R(ang)})" d="M0 0 C${R(len*.3)} ${R(-w)} ${R(len*.75)} ${R(-w*.8)} ${R(len)} 0 C${R(len*.75)} ${R(w*.8)} ${R(len*.3)} ${R(w)} 0 0Z"/>`;}
function sprig(cx,cy,r,a0,a1,n,L,W,stemW){
  const rad=d=>d*Math.PI/180,p=a=>[cx+r*Math.cos(rad(a)),cy+r*Math.sin(rad(a))];
  const [x0,y0]=p(a0),[x1,y1]=p(a1),large=Math.abs(a1-a0)>180?1:0,sweep=a1>a0?1:0,dir=a1>a0?1:-1;
  let o=`<path d="M${R(x0)} ${R(y0)} A${r} ${r} 0 ${large} ${sweep} ${R(x1)} ${R(y1)}" fill="none" stroke-width="${stemW}" stroke-linecap="round"/>`;
  for(let i=0;i<n;i++){const t=(i+.6)/n,a=a0+(a1-a0)*t,[x,y]=p(a),tang=a+90*dir,s=1-.4*t;o+=leaf(x,y,tang-38,L*s,W*s)+leaf(x,y,tang+38,L*s,W*s);}
  const [tx,ty]=p(a1); return o+leaf(tx,ty,a1+90*dir,L*.55,W*.55);
}
function blob(cx,cy,R0){let d='';const N=220;for(let i=0;i<=N;i++){const th=i/N*2*Math.PI;
  const r=R0+2.6*Math.sin(7*th+.4)+1.5*Math.sin(13*th+1.1)+.9*Math.sin(23*th+.2)+10*Math.exp(-Math.pow((th-1.0)/.2,2))+6*Math.exp(-Math.pow((th-1.42)/.13,2));
  d+=(i?'L':'M')+R(cx+r*Math.cos(th))+' '+R(cy+r*Math.sin(th));}return d+'Z';}
const B=blob(100,98,82);
const wreath=sprig(100,98,55,114,246,7,11.5,3.8,1.4)+sprig(100,98,55,66,-66,7,11.5,3.8,1.4);
const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
<path d="${B}" fill="#8e1b17"/>
<g fill="#f6f1e7" stroke="#f6f1e7">${wreath}</g>
<text x="101.5" y="132.5" text-anchor="middle" font-family="Playfair Display" font-weight="900" font-size="94" fill="#5c0f0c" opacity=".6">К</text>
<text x="100" y="131" text-anchor="middle" font-family="Playfair Display" font-weight="900" font-size="94" fill="#f6f1e7">К</text>
</svg>`;
document.getElementById('box').innerHTML=svg;
window.SVG=svg;
</script></body></html>
